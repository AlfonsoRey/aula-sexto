backend:
  name: github
  repo: AlfonsoRey/aula-sexto
  branch: main
  base_url: "__EDITOR_ORIGIN__"
  auth_endpoint: auth
  squash_merges: true
  commit_messages:
    create: "Crear {{collection}} «{{slug}}»\n\nCo-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>"
    update: "Actualizar {{collection}} «{{slug}}»\n\nCo-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>"
publish_mode: editorial_workflow
locale: es
site_url: "__PUBLIC_ORIGIN__"
display_url: "__PUBLIC_ORIGIN__"
media_folder: editor/media
public_folder: /media
media_library:
  name: disabled
show_preview_links: false
collections:
  - name: catalogo
    label: Catálogo de cursos, materias y temas
    publish: false
    files:
      - name: catalogo
        label: Catálogo
        file: public/data/catalog.json
        fields:
          - { name: version, label: Versión del formato, widget: hidden, default: 2 }
          - name: courses
            label: Cursos
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: id, label: ID de curso, widget: string, pattern: ['^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$', "Usa un ID estable sin tildes."] }
              - { name: title, label: Nombre del curso, widget: string }
              - { name: region, label: Comunidad autónoma, widget: string }
              - { name: description, label: Descripción, widget: text }
              - { name: requiresSource, label: Exigir fuente y licencia por ejercicio, widget: boolean, required: false, default: false }
              - { name: subjects, label: IDs de materias del curso, widget: list, hint: "Cada materia debe existir y pertenecer a un único curso." }
          - name: subjects
            label: Materias
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: id, label: ID de materia, widget: string, pattern: ['^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$', "Usa un ID estable sin tildes."] }
              - { name: title, label: Título, widget: string }
              - { name: description, label: Descripción, widget: text }
              - name: topics
                label: Temas (requieren archivo y colección)
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { name: id, label: ID de tema, widget: string }
                  - { name: title, label: Título, widget: string }
                  - { name: description, label: Descripción, widget: text }
                  - { name: file, label: Ruta JSON, widget: string, hint: "/data/ID_MATERIA/ID_TEMA.json; requiere añadir archivo y colección antes de publicar." }
  - name: matematicas
    label: 6.º · Matemáticas y lógica
    publish: false
    files:
      - name: calculo
        label: Cálculo y divisibilidad
        file: public/data/matematicas/calculo.json
        fields:
          - { name: topic, label: Tema, widget: hidden, default: calculo }
          - &exercises
            name: exercises
            label: Ejercicios
            widget: list
            summary: "{{fields.title}} · {{fields.difficulty}}"
            fields:
              - { name: id, label: ID único y estable, widget: string, pattern: ['^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$', "Usa minúsculas y guiones, sin tildes ni espacios."] }
              - { name: title, label: Título, widget: string }
              - { name: difficulty, label: Dificultad, widget: select, options: [inicial, intermedio, reto] }
              - { name: statement, label: Enunciado, widget: text }
              - name: hints
                label: Pistas (de menor a mayor ayuda)
                widget: list
                field: { name: text, label: Pista, widget: text }
              - { name: solution, label: Solución resumida (con unidades), widget: text }
              - name: steps
                label: Explicación paso a paso
                widget: list
                field: { name: text, label: Paso, widget: text }
              - { name: tags, label: Etiquetas de búsqueda, widget: list }
              - name: source
                label: Fuente de ejercicio adaptado (obligatoria en Bachillerato)
                widget: object
                required: false
                fields:
                  - { name: author, label: Autoría y atribución, widget: text }
                  - { name: title, label: Título del recurso original, widget: string }
                  - { name: url, label: URL HTTPS del documento o archivo original, widget: string }
                  - { name: recordUrl, label: Ficha de procedencia y licencia, widget: string }
                  - { name: locator, label: Archivo interno, página, sección y ejercicio, widget: text }
                  - { name: license, label: Licencia, widget: select, options: ["CC BY-NC-SA (versión no indicada en la ficha); adaptación bajo la misma licencia"] }
                  - { name: adaptation, label: Traducción y cambios respecto al original, widget: text }
                  - { name: verifiedOn, label: Fecha de revisión (AAAA-MM-DD), widget: string, pattern: ['^\d{4}-\d{2}-\d{2}$', "Formato AAAA-MM-DD."] }
              - name: chart
                label: Tabla y gráfico (opcional)
                widget: object
                required: false
                fields:
                  - { name: caption, label: Título del gráfico, widget: string }
                  - { name: categoryLabel, label: Etiqueta de categorías, widget: string }
                  - { name: valueLabel, label: Etiqueta de valores y unidades, widget: string }
                  - name: values
                    label: Datos
                    widget: list
                    fields:
                      - { name: label, label: Etiqueta, widget: string }
                      - { name: value, label: Valor, widget: number, value_type: float, min: 0, max: 1000000 }
      - name: fracciones
        label: Fracciones
        file: public/data/matematicas/fracciones.json
        fields:
          - { name: topic, label: Tema, widget: hidden, default: fracciones }
          - *exercises
      - name: decimales
        label: Números decimales
        file: public/data/matematicas/decimales.json
        fields:
          - { name: topic, label: Tema, widget: hidden, default: decimales }
          - *exercises
      - name: proporcionalidad
        label: Porcentajes y proporciones
        file: public/data/matematicas/proporcionalidad.json
        fields:
          - { name: topic, label: Tema, widget: hidden, default: proporcionalidad }
          - *exercises
      - name: medida
        label: Medidas y unidades
        file: public/data/matematicas/medida.json
        fields:
          - { name: topic, label: Tema, widget: hidden, default: medida }
          - *exercises
      - name: geometria
        label: Geometría
        file: public/data/matematicas/geometria.json
        fields:
          - { name: topic, label: Tema, widget: hidden, default: geometria }
          - *exercises
      - name: datos
        label: Datos y probabilidad
        file: public/data/matematicas/datos.json
        fields:
          - { name: topic, label: Tema, widget: hidden, default: datos }
          - *exercises
      - name: logica
        label: Lógica y problemas
        file: public/data/matematicas/logica.json
        fields:
          - { name: topic, label: Tema, widget: hidden, default: logica }
          - *exercises
      - name: repaso-sexto
        label: Más retos de sexto
        file: public/data/matematicas/repaso-sexto.json
        fields:
          - { name: topic, label: Tema, widget: hidden, default: repaso-sexto }
          - *exercises
  - name: matematicas-tercero
    label: 3.º · Matemáticas
    publish: false
    files:
      - name: numeros-tercero
        label: Números y cálculo
        file: public/data/matematicas-tercero/numeros-tercero.json
        fields:
          - { name: topic, label: Tema, widget: hidden, default: numeros-tercero }
          - *exercises
      - name: problemas-tercero
        label: Problemas y fracciones sencillas
        file: public/data/matematicas-tercero/problemas-tercero.json
        fields:
          - { name: topic, label: Tema, widget: hidden, default: problemas-tercero }
          - *exercises
      - name: medidas-tercero
        label: Medidas, tiempo y dinero
        file: public/data/matematicas-tercero/medidas-tercero.json
        fields:
          - { name: topic, label: Tema, widget: hidden, default: medidas-tercero }
          - *exercises
      - name: formas-datos-tercero
        label: Formas, datos y lógica
        file: public/data/matematicas-tercero/formas-datos-tercero.json
        fields:
          - { name: topic, label: Tema, widget: hidden, default: formas-datos-tercero }
          - *exercises
  - name: bachillerato-fuentes
    label: 1.º Bachillerato · Ejercicios adaptados y fuentes de Galicia
    publish: false
    files:
      - name: algebra-trigonometria-bachillerato
        label: Matemáticas I · Álgebra y trigonometría
        file: public/data/matematicas-bachillerato/algebra-trigonometria-bachillerato.json
        fields:
          - { name: topic, label: Tema, widget: hidden, default: algebra-trigonometria-bachillerato }
          - *exercises
          - &resources
            name: resources
            label: Documentos externos (no ejercicios integrados)
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: id, label: ID único y estable, widget: string, pattern: ['^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$', "Usa minúsculas y guiones."] }
              - { name: title, label: Título, widget: string }
              - { name: statement, label: Descripción del documento (no copiar enunciados), widget: text }
              - { name: tags, label: Etiquetas de búsqueda, widget: list }
              - name: source
                label: Procedencia comprobada
                widget: object
                fields:
                  - { name: url, label: URL HTTPS del original, widget: string, hint: "Solo recursos.edu.xunta.gal o www.edu.xunta.gal; comprobar el documento antes de guardar." }
                  - { name: recordUrl, label: URL de ficha (opcional), widget: string, required: false }
                  - { name: publisher, label: Publicado por (no asumir autoría), widget: string }
                  - { name: locator, label: Archivo y localizador, widget: text }
                  - { name: language, label: Idioma del original, widget: string }
                  - { name: published, label: Fecha de publicación o limitación conocida, widget: string }
                  - { name: license, label: Licencia y límites de uso, widget: text }
                  - { name: verifiedOn, label: Fecha de comprobación (AAAA-MM-DD), widget: string, pattern: ['^\d{4}-\d{2}-\d{2}$', "Formato AAAA-MM-DD."] }
                  - { name: notes, label: Limitaciones y advertencias, widget: text }
      - name: cinematica-bachillerato
        label: Física · Cinemática
        file: public/data/fisica-bachillerato/cinematica-bachillerato.json
        fields:
          - { name: topic, label: Tema, widget: hidden, default: cinematica-bachillerato }
          - *exercises
          - *resources
